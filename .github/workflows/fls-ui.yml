name: Validate Football Life Simulator UI
on:
  pull_request:
    paths:
      - 'assets/js/fls-ui.js'
      - 'assets/js/fls-precision-v4.js'
      - 'assets/css/fls-precision-v4.css'
      - 'tests/fls-layout-audit.mjs'
      - 'assets/js/fls-personality-v3.js'
      - 'assets/css/fls-personality-v3.css'
      - 'assets/js/fls-crest-catalog.js'
      - 'assets/css/fls-ui-v2.css'
      - 'assets/css/fls-ui.css'
      - 'index.html'
      - 'tests/fls-ui-smoke.mjs'
      - '.github/workflows/fls-ui.yml'
  push:
    branches:
      - feature/football-life-ui-v1
      - feature/fls-ui-v2-club-crests
      - feature/fls-matchday-personality-v3
      - feature/fls-ui-v4-centering-polish
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check assets/js/fls-ui.js && node --check assets/js/fls-precision-v4.js && node --check tests/fls-layout-audit.mjs && node --check assets/js/fls-personality-v3.js && node --check assets/js/fls-crest-catalog.js && node --check tests/fls-ui-smoke.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser UI smoke test
        run: node tests/fls-ui-smoke.mjs
      - name: Geometry, centering and responsive visual audit
        run: node tests/fls-layout-audit.mjs
      - name: Upload UI review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: football-life-ui-v4-layout-gallery
          path: tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
